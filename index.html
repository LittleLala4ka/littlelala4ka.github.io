<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="Все проекты LittleLala4ka в одном месте.">
  <title>LittleLala4ka — мои сайты</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d14;
      --panel: rgba(22, 26, 40, .82);
      --text: #f4f5fb;
      --muted: #9ba3b8;
      --accent: #9b8cff;
      --accent2: #70d6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--text);
      background:
        radial-gradient(ellipse at 18% 10%, rgba(112,214,255,.12), transparent 38%),
        radial-gradient(ellipse at 85% 25%, rgba(155,140,255,.16), transparent 35%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, footer { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 0;
    }
    .brand { display: flex; gap: 12px; align-items: center; font-weight: 750; letter-spacing: -.03em; }
    .logo {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #0b0d14; font-size: 20px; font-weight: 900;
    }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    main {
      width: min(900px, calc(100% - 40px)); margin: 0 auto;
      display: flex; flex-direction: column; justify-content: center; padding: 54px 0 90px;
    }
    .intro { text-align: center; margin-bottom: 42px; }
    h1 { margin: 0 0 14px; font-size: clamp(36px, 6vw, 62px); line-height: 1.05; letter-spacing: -.055em; }
    .intro p { margin: 0; color: var(--muted); font-size: clamp(15px, 2vw, 18px); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start;
      min-height: 260px; padding: 28px; border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px; background: var(--panel); box-shadow: 0 20px 60px rgba(0,0,0,.16);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .card::before {
      content: ""; position: absolute; width: 180px; height: 180px; right: -70px; top: -80px;
      border-radius: 50%; background: var(--glow); filter: blur(2px); opacity: .17; pointer-events: none;
    }
    .card:hover { transform: translateY(-5px); border-color: rgba(155,140,255,.5); background: rgba(27,31,48,.95); }
    .icon {
      width: 54px; height: 54px; display: grid; place-items: center; border-radius: 17px;
      background: rgba(255,255,255,.07); font-size: 25px; margin-bottom: 26px;
    }
    .card h2 { margin: 0 0 9px; font-size: 25px; letter-spacing: -.03em; }
    .card p { margin: 0 0 26px; color: var(--muted); line-height: 1.6; }
    .link {
      display: inline-flex; align-items: center; gap: 9px; margin-top: auto;
      color: #0b0d14; background: linear-gradient(100deg, var(--accent2), var(--accent));
      border-radius: 12px; padding: 12px 16px; text-decoration: none; font-weight: 750;
      transition: filter .2s ease;
    }
    .link:hover { filter: brightness(1.12); }
    footer { padding: 22px 0 28px; text-align: center; color: #727b91; font-size: 13px; }
    @media (max-width: 620px) {
      header, footer { width: calc(100% - 32px); }
      header { padding: 20px 0; }
      main { width: calc(100% - 32px); padding: 44px 0 56px; }
      .cards { grid-template-columns: 1fr; }
      .card { min-height: 230px; padding: 24px; }
      .intro { margin-bottom: 30px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">L</span><span>LittleLala4ka</span></div>
    <span class="eyebrow">Мои проекты</span>
  </header>

  <main>
    <section class="intro">
      <h1>Выбери свой сайт</h1>
      <p>Два проекта — одна точка входа.</p>
    </section>

    <section class="cards" aria-label="Список сайтов">
      <article class="card" style="--glow:#70d6ff">
        <div class="icon" aria-hidden="true">◫</div>
        <h2>Сайт 1</h2>
        <p>Основной проект</p>
        <!-- ЗАМЕНИ href на настоящий адрес первого сайта -->
        <a class="link" href="https://littlelala4ka.github.io/site1/">Перейти на сайт <span aria-hidden="true">↗</span></a>
      </article>

      <article class="card" style="--glow:#9b8cff">
        <div class="icon" aria-hidden="true">✦</div>
        <h2>Сайт 2</h2>
        <p>Второй проект</p>
        <!-- ЗАМЕНИ href на настоящий адрес второго сайта -->
        <a class="link" href="https://littlelala4ka.github.io/site2/">Перейти на сайт <span aria-hidden="true">↗</span></a>
      </article>
    </section>
  </main>

  <footer>LittleLala4ka · 2026</footer>
</body>
</html>
